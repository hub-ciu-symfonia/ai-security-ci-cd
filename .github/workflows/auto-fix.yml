name: Auto-fix issue (AI agent)

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run auto-fix agent
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET_FILE_PATH: src/VictimApi/Program.cs
          BASE_BRANCH: main
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
          GITHUB_TOKEN: ${{ secrets.AGENT_PAT }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: dotnet run --project src/AutoFixAgent
